name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b # v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install shared packages
        run: wally install
      - name: Install test packages
        run: wally install --project-path tests
      - name: Lint
        run: selene src tests
      - name: Format
        run: stylua --check src tests
      - name: Strict Luau analysis
        run: ./tools/Typecheck.ps1
      - name: Rojo build
        run: rojo build default.project.json -o .verification/mythic-legends-check.rbxlx
      - name: Whitespace
        run: git diff --check
